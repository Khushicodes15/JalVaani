# Nginx reverse-proxy for JalVaani AI
# Place in front of gunicorn for TLS termination, gzip, and static-asset caching.
# In production, replace `server_name _` with your domain and add TLS blocks.

worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;   # Handles 4k simultaneous connections per worker
    use epoll;                  # Linux: use efficient epoll I/O model
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   500;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # ── Upstream (gunicorn) ───────────────────────────────────────────────────
    upstream jalvaani_api {
        server 127.0.0.1:8000;
        keepalive 32;   # Keep 32 idle connections to upstream (avoids TCP handshake per request)
    }

    # ── Rate limiting (Nginx-level, before app-level) ─────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=100r/m;

    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ── Static assets (Vite fingerprints filenames — cache aggressively) ──
        location /assets/ {
            root /app/jalvaani_ui/dist;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── API proxy ─────────────────────────────────────────────────────────
        location ~ ^/(predict|forecast|report|stations|stats|health|docs|openapi)  {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://jalvaani_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";         # Enable upstream keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  120s;
            proxy_connect_timeout 10s;

            # Cache GET API responses with no user-specific data
            proxy_cache_methods GET;
        }

        # ── SPA catch-all (React Router) ──────────────────────────────────────
        location / {
            root  /app/jalvaani_ui/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires -1;   # Never cache index.html (it references fingerprinted assets)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
